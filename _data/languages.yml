# ─────────────────────────────────────────────────────────────────────────────
#  Languages the site is published in. The first entry is the default and lives
#  at the site root; every other language lives under /<code>/.
#
#  To add a language:
#    1. copy _data/i18n/en/ to _data/i18n/<code>/ and translate the three files
#    2. add an entry here
#    3. copy the three stub pages from ro/ to <code>/ and change `lang:` in each
# ─────────────────────────────────────────────────────────────────────────────
#  "locale" is the underscore form Open Graph wants (og:locale); "code" is the
#  plain BCP-47 tag used for lang= and hreflang.
- code: en
  locale: "en_US"
  label: "EN"
  name: "English"
- code: ro
  locale: "ro_RO"
  label: "RO"
  name: "Română"
