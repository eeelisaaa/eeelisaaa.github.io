about:
  title: >-                                       # markdown
    My work is the intersection of *technical skill* and *analytical thinking.*
  paragraphs:                                     # markdown
    - >-
      Two years of computer science at Politehnica University of Bucharest gave me the
      fundamentals — algorithms, data structures, SQL, Operating Systems, C/C++. A year of sociology
      at the University of Bucharest added the other half: how to design research, run the
      statistics, and interpret what the numbers actually mean.
    - >-
      That combination is what I'm most useful for. I can write the query, and also tell
      you whether the sample it draws from justifies the conclusion someone wants to put
      in a slide.
    - >-
      I'm based in Germany, expert in English, and actively learning German. I'm looking for an IT or data-oriented role where both halves
      get used.
  facts:
    - {label: "Based in",    value: "Germany"}
    - {label: "Status",      value: "EU citizen (Romanian)"}
    - {label: "Languages",   value: "English C2 · French B1 · German A1 · Romanian native"}
    - {label: "Looking for", value: "Entry-level IT / data"}

